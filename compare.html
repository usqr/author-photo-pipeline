<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Author Photo Pipeline</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui;background:#1a1a2e;color:#eee;margin:0;padding:20px}
h1{text-align:center;margin-bottom:5px}
.legend{display:flex;justify-content:center;gap:20px;margin:10px 0 15px;font-size:12px}

/* Progress bar */
.progress-container{background:#0a0a1a;border:1px solid #333;border-radius:8px;padding:10px 16px;margin:0 auto 20px;max-width:700px;display:none}
.progress-container.active{display:block}
.progress-bar-wrap{background:#222;border-radius:4px;height:8px;overflow:hidden;margin:6px 0}
.progress-bar{height:100%;background:linear-gradient(90deg,#4ecca3,#e94560);border-radius:4px;transition:width .3s}
.progress-text{font-size:11px;color:#aaa;display:flex;justify-content:space-between}
.progress-pass{color:#4ecca3;font-weight:bold}
.progress-toggle{font-size:10px;color:#888;cursor:pointer;text-align:center;margin-top:4px;user-select:none}
.progress-toggle:hover{color:#ccc}
.progress-details{display:none;margin-top:8px;border-top:1px solid #333;padding-top:8px}
.progress-details.open{display:block}
.pd-pass{margin-bottom:8px}
.pd-pass-header{display:flex;align-items:center;gap:8px;font-size:11px;margin-bottom:3px;cursor:pointer;user-select:none}
.pd-pass-header:hover{color:#fff}
.pd-arrow{font-size:8px;color:#888;transition:transform .2s;display:inline-block;width:10px}
.pd-arrow.open{transform:rotate(90deg)}
.pd-pass-name{font-weight:bold;color:#4ecca3}
.pd-pass-name.active{color:#f0a500}
.pd-pass-name.pending{color:#555}
.pd-pass-count{color:#888;font-size:10px}
.pd-pass-time{color:#555;font-size:9px;margin-left:auto}
.pd-pass-bar{background:#222;border-radius:3px;height:4px;overflow:hidden;margin:2px 0}
.pd-pass-bar-fill{height:100%;border-radius:3px;transition:width .3s}
.pd-pass-bar-fill.done{background:#4ecca3}
.pd-pass-bar-fill.active{background:linear-gradient(90deg,#f0a500,#e94560)}
.pd-pass-bar-fill.skipped{background:#555}
.pd-files{display:none;padding:4px 0 4px 18px;font-size:9px;color:#777;max-height:200px;overflow-y:auto}
.pd-files.open{display:block}
.pd-file{padding:2px 0;display:flex;gap:8px;align-items:center;border-bottom:1px solid #1a1a2e}
.pd-file.current{color:#f0a500;font-weight:bold}
.pd-fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd-fstatus{font-size:8px;padding:1px 5px;border-radius:3px;flex-shrink:0}
.pd-fstatus.done{background:#0a2a1a;color:#4ecca3}
.pd-fstatus.processing{background:#2a2a0a;color:#f0a500}
.pd-fstatus.skipped{background:#1a1a1a;color:#555}
.pd-fstatus.fallback{background:#2a1a0a;color:#f0a500}
.pd-fstatus.error{background:#2a0a0a;color:#e94560}
.pd-ftime{color:#555;font-size:8px;flex-shrink:0;min-width:35px;text-align:right}
.pd-total-time{text-align:center;font-size:10px;color:#555;margin-top:6px}

.controls{display:flex;justify-content:center;gap:10px;margin-bottom:15px;flex-wrap:wrap}
.controls button{padding:7px 14px;border:1px solid #444;background:#16213e;color:#eee;border-radius:6px;cursor:pointer;font-size:12px}
.controls button:hover{background:#0f3460}
.btn-rerun{background:#0a3a0a!important;border-color:#4ecca3!important;color:#4ecca3!important}
.btn-rerun:hover{background:#0a5a0a!important}
.btn-stop{background:#3a0a0a!important;border-color:#e94560!important;color:#e94560!important}
.btn-stop:hover{background:#5a0a0a!important}
.runcfg{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;align-items:center;background:#16213e;border:1px solid #333;border-radius:8px;padding:10px 16px;margin:0 auto 15px;max-width:900px;font-size:12px}
.runcfg label{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.runcfg-match,.runcfg-bg,.runcfg-steps{display:flex;align-items:center;gap:8px}
.runcfg input[type="range"]{width:120px;accent-color:#4ecca3}
#bg-match-val{width:24px;text-align:center;color:#4ecca3;font-weight:bold}
.filter-bar{display:flex;justify-content:center;gap:8px;margin-bottom:15px}
.badge{padding:4px 10px;border-radius:12px;font-size:11px;cursor:pointer;border:1px solid #333}
.badge:hover{border-color:#888}
.ref-row{display:flex;gap:12px;justify-content:center;margin:15px 0;padding:15px;background:#16213e;border-radius:12px;flex-wrap:wrap}
.ref-row .card{text-align:center}
.ref-row img{height:90px;border-radius:8px}
.author-row{background:#16213e;padding:12px;border-radius:10px;margin-bottom:8px}
.rsec{display:flex;gap:10px;align-items:flex-start}
.rsec+.rsec{margin-top:5px;padding-top:5px;border-top:1px solid #2a2a4e}
.author-images{display:flex;gap:6px;align-items:center}
.author-images .card{text-align:center;flex-shrink:0}
.img-n{width:110px;height:110px;object-fit:cover;border-radius:8px;border:2px solid #4ecca3;transition:transform .2s}
.img-n:hover{transform:scale(3.5);position:relative;z-index:100}
.card-ph{width:110px;height:110px;box-sizing:border-box;border-radius:8px;background:#0e1430;border:2px dashed #40406a;display:flex;align-items:center;justify-content:center;color:#666;font-size:9px;text-align:center;padding:4px}
.img-p{width:65px;height:65px;object-fit:cover;border-radius:6px;border:2px solid #f0a500;opacity:.9;transition:transform .2s}
.img-p:hover{transform:scale(4);position:relative;z-index:100;opacity:1}
.img-b{width:65px;height:65px;object-fit:cover;border-radius:6px;border:2px solid #e94560;opacity:.85;transition:transform .2s}
.img-b:hover{transform:scale(4);position:relative;z-index:100;opacity:1}
.rlbl{font-weight:bold;min-width:100px;max-width:100px;font-size:10px;word-break:break-all;flex-shrink:0;padding-top:4px}
.rlbl-sm{min-width:100px;max-width:100px;font-size:9px;flex-shrink:0;padding-top:4px}
.cn{color:#4ecca3}.cp{color:#f0a500}.cb{color:#e94560}
.label{font-size:8px;margin-top:2px}
.sp{display:flex;flex-direction:column;gap:3px;min-width:350px;flex-shrink:0}
.imgopt{display:flex;gap:12px;align-items:center;font-size:10px;color:#aaa;margin-top:4px;flex-wrap:wrap}
.imgopt label{display:inline-flex;align-items:center;gap:3px;cursor:pointer}
.imgopt input[type="range"]{width:90px;accent-color:#4ecca3;vertical-align:middle}
.io-match{display:inline-flex;align-items:center;gap:4px}
#io-bmv,[id^="io-bmv-"]{width:20px;text-align:center;color:#4ecca3}
.sr{display:flex;align-items:center;gap:5px;height:22px}
.sl{font-size:10px;width:70px;text-align:right;color:#aaa;flex-shrink:0}
.sv{font-size:11px;width:30px;text-align:center;font-weight:bold;flex-shrink:0}
.sv.neg{color:#e94560}.sv.zero{color:#555}.sv.pos{color:#4ecca3}
.slider-wrap{flex:1;position:relative;height:20px;display:flex;align-items:center}
.slider-wrap input[type="range"]{width:100%;height:4px;accent-color:#e94560;cursor:pointer;margin:0}
.ghost-marker{position:absolute;top:-2px;width:2px;height:14px;background:#f0a500;opacity:.8;pointer-events:none;border-radius:1px;z-index:5}
.ghost-label{position:absolute;top:-13px;font-size:7px;color:#f0a500;pointer-events:none;transform:translateX(-50%);white-space:nowrap}
.row-ok{border-left:3px solid #4ecca3}.row-issue{border-left:3px solid #e94560}
.export-area{margin-top:20px;text-align:center}
textarea{width:90%;height:150px;background:#0a0a1a;color:#4ecca3;border:1px solid #333;border-radius:8px;padding:10px;font-family:monospace;font-size:11px}
h2{margin-top:25px;font-size:16px}
</style></head><body>
<h1>Author Photo Pipeline</h1>
<div class="legend" id="legend">
<span><span style="color:#4ecca3">&#9632;</span> Current (<span id="legend-new">...</span>)</span>
<span><span style="color:#f0a500">&#9632;</span> Previous (<span id="legend-prev">...</span>) — orange slider markers</span>
<span><span style="color:#e94560">&#9632;</span> Baseline (no weights)</span>
</div>

<div class="progress-container" id="progress-container">
  <div class="progress-text">
    <span>Pass <span class="progress-pass" id="p-pass">-</span>: <span id="p-name">-</span></span>
    <span><span id="p-cur">0</span>/<span id="p-tot">0</span> — <span id="p-file">-</span> <span id="p-elapsed" style="color:#555"></span></span>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="p-bar" style="width:0%"></div></div>
  <div class="progress-toggle" id="p-toggle" onclick="toggleDetails()">&#9660; Details</div>
  <div class="progress-details" id="p-details"></div>
</div>

<div class="controls">
<button onclick="resetToPrev()">Reset to Prev</button>
<button onclick="resetAll()">Reset to 0</button>
<button onclick="exportJSON()">Export JSON</button>
<button onclick="importJSON()">Import</button>
<button onclick="copyJSON()">Copy JSON</button>
<button class="btn-rerun" onclick="rerun()">Rerun Changed</button>
<button class="btn-rerun" onclick="regenerate()">Regenerate All</button>
<button class="btn-rerun" onclick="regenFrom()">Regen from Pass...</button>
<button class="btn-stop" onclick="endAll()">End All</button>
<span style="color:#888;font-size:11px;padding-top:8px" id="stats"></span>
</div>
<div class="runcfg" id="runcfg">
  <div class="runcfg-steps">
    <label><input type="checkbox" id="st-upscale" checked> Upscale</label>
    <label><input type="checkbox" id="st-canvas_extend" checked> Canvas extend</label>
    <label><input type="checkbox" id="st-bw" checked> Convert to B&amp;W</label>
    <label><input type="checkbox" id="st-bg_match" checked> Match background tone</label>
  </div>
  <div class="runcfg-match">
    <span>Colour match</span>
    <input type="range" id="bg-match-amount" min="0" max="100" step="5" value="50">
    <span id="bg-match-val">50</span>
  </div>
  <div class="runcfg-bg">
    <span>Background:</span>
    <label><input type="radio" name="bgsel" value="rainbow" checked> Rainbow</label>
    <label><input type="radio" name="bgsel" value="leafs"> Leafs</label>
    <label><input type="radio" name="bgsel" value="cork"> Cork</label>
    <label><input type="radio" name="bgsel" value="custom"> Custom</label>
    <input type="file" id="bg-custom-file" accept="image/png,image/jpeg,image/webp" style="font-size:11px;max-width:160px">
  </div>
</div>
<div class="filter-bar">
<span class="badge" style="background:#16213e;color:#eee" onclick="filterRows('all')" id="badge-all">All</span>
<span class="badge" style="background:#3a1a1a;color:#e94560" onclick="filterRows('issues')" id="badge-issues">Issues</span>
<span class="badge" style="background:#1a3a2a;color:#4ecca3" onclick="filterRows('ok')" id="badge-ok">OK</span>
<span class="badge" style="background:#3a2a00;color:#f0a500" onclick="filterRows('changed')" id="badge-changed">Changed</span>
</div>
<h2>All Authors</h2>
<div id="grid"></div>
<div class="export-area">
<h2>Export / Import</h2>
<textarea id="jsonArea"></textarea>
</div>
<script>
var NR="",PR="";
var PREV_RATINGS={};
var SCALES=[
{key:"lightness",label:"Lightness"},{key:"contrast",label:"Contrast"},
{key:"dark_areas",label:"Dark Areas"},{key:"light_areas",label:"Light Areas"},
{key:"sharpness",label:"Sharpness"},{key:"pixelization",label:"Pixelization"},
{key:"detail",label:"Detail"}
];
var FILES=[];
var ratings={};
var DEFAULT_SETTINGS={steps:{upscale:true,canvas_extend:true,bw:true,bg_match:true},bg_match_amount:50,background:"rainbow",custom_background:""};
var SETTINGS=JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
var LOADED_SETTINGS=JSON.parse(JSON.stringify(DEFAULT_SETTINGS));   // snapshot of settings at page load, for global-change detection
var CUSTOM_BG="";   // filename of the last uploaded custom background
var IMG_OPTS={};        // last-saved overrides from server
var imgOverrides={};    // live per-file overrides {name:{upscale,canvas_extend,bg_match}}
function oio(i){
  var n=FILES[i].name;var o=imgOverrides[n]||(imgOverrides[n]={});
  o.upscale=document.getElementById("io-up-"+i).checked;
  o.canvas_extend=document.getElementById("io-ce-"+i).checked;
}
function oioBm(i,v){
  var n=FILES[i].name;var o=imgOverrides[n]||(imgOverrides[n]={});
  o.bg_match=parseInt(v,10);
  document.getElementById("io-bmv-"+i).textContent=v;
}
function gpv(n,k){return PREV_RATINGS[n]&&PREV_RATINGS[n][k]!==undefined?PREV_RATINGS[n][k]:0;}
function gp(v){return((v+100)/200)*100;}

function init(){
var g=document.getElementById("grid"),en=encodeURIComponent;
FILES.forEach(function(f,i){
ratings[f.name]={};
SCALES.forEach(function(s){ratings[f.name][s.key]=gpv(f.name,s.key);});
var r=document.createElement("div");
var hi=SCALES.some(function(s){return ratings[f.name][s.key]!==0;});
r.className="author-row "+(hi?"row-issue":"row-ok");r.id="row-"+i;
r.innerHTML=
'<div class="rsec">'+
'<div class="rlbl">'+f.name+'</div>'+
'<div class="author-images">'+
'<div class="card"><img class="img-n" src="webp/'+en(f.name)+'"><div class="label cn">Original</div></div>'+
'<div class="card"><img class="img-n" src="'+NR+'/step3_bw/'+en(f.stem)+'.png" onerror="this.onerror=null;var p=document.createElement(\'div\');p.className=\'card-ph\';p.textContent=\'no output yet\';this.replaceWith(p)"><div class="label cn">Adjust</div></div>'+
'<div class="card"><img class="img-n" src="'+NR+'/step4_rainbow/'+en(f.name)+'" onerror="this.onerror=null;var p=document.createElement(\'div\');p.className=\'card-ph\';p.textContent=\'no output yet\';this.replaceWith(p)"><div class="label cn">BG</div></div>'+
'</div>'+
'<div class="sp" id="sl-'+i+'"></div>'+
'<div class="imgopt" id="io-'+i+'">'+
'<label><input type="checkbox" id="io-up-'+i+'" onchange="oio('+i+')"> upscale</label>'+
'<label><input type="checkbox" id="io-ce-'+i+'" onchange="oio('+i+')"> canvas</label>'+
'<span class="io-match"><input type="range" id="io-bm-'+i+'" min="0" max="100" step="5" oninput="oioBm('+i+',this.value)"><span id="io-bmv-'+i+'"></span></span>'+
'</div>'+
'</div>'+
(PR?('<div class="rsec">'+
'<div class="rlbl-sm cp">last ('+PR+')</div>'+
'<div class="author-images">'+
'<div class="card"><img class="img-p" src="'+PR+'/step3_bw/'+en(f.stem)+'.png" onerror="this.closest(\'.card\').style.display=\'none\'"><div class="label cp">Adjust</div></div>'+
'<div class="card"><img class="img-p" src="'+PR+'/step4_rainbow/'+en(f.name)+'" onerror="this.closest(\'.card\').style.display=\'none\'"><div class="label cp">BG</div></div>'+
'</div>'+
'</div>'):'')+
'<div class="rsec">'+
'<div class="rlbl-sm cb">first (baseline)</div>'+
'<div class="author-images">'+
'<div class="card"><img class="img-b" src="baseline_bw/'+en(f.stem)+'.png" onerror="this.closest(\'.card\').style.display=\'none\'"><div class="label cb">Adjust</div></div>'+
'<div class="card"><img class="img-b" src="baseline_rainbow/'+en(f.name)+'" onerror="this.closest(\'.card\').style.display=\'none\'"><div class="label cb">BG</div></div>'+
'</div>'+
'</div>';
g.appendChild(r);
var p=document.getElementById("sl-"+i);
SCALES.forEach(function(s){
var pv=gpv(f.name,s.key),cv=ratings[f.name][s.key];
var d=document.createElement("div");d.className="sr";
var gh='';
if(pv!==0){var pos=gp(pv);gh='<div class="ghost-marker" style="left:'+pos+'%"></div><div class="ghost-label" style="left:'+pos+'%">'+pv+'</div>';}
d.innerHTML='<span class="sl">'+s.label+'</span>'+
'<div class="slider-wrap"><input type="range" min="-100" max="100" step="10" value="'+cv+'" id="s-'+i+'-'+s.key+'" oninput="os('+i+',\''+s.key+'\',this.value)">'+gh+'</div>'+
'<span class="sv '+(cv<0?'neg':cv>0?'pos':'zero')+'" id="v-'+i+'-'+s.key+'">'+cv+'</span>';
p.appendChild(d);
});
});us();
}

function seedImgOpts(){
  var g=getSettings();
  FILES.forEach(function(f,i){
    var ov=IMG_OPTS[f.name]||{};
    var up=(ov.upscale!==undefined)?ov.upscale:g.steps.upscale;
    var ce=(ov.canvas_extend!==undefined)?ov.canvas_extend:g.steps.canvas_extend;
    var bm=(ov.bg_match!==undefined)?ov.bg_match:g.bg_match_amount;
    document.getElementById("io-up-"+i).checked=!!up;
    document.getElementById("io-ce-"+i).checked=!!ce;
    document.getElementById("io-bm-"+i).value=bm;
    document.getElementById("io-bmv-"+i).textContent=bm;
    // seed live state from any loaded override so it persists on rerun
    if(Object.keys(ov).length)imgOverrides[f.name]=JSON.parse(JSON.stringify(ov));
  });
}

function getImageOptions(){
  var g=getSettings();var out={};
  FILES.forEach(function(f,i){
    var o={};
    var up=document.getElementById("io-up-"+i).checked;
    var ce=document.getElementById("io-ce-"+i).checked;
    var bm=parseInt(document.getElementById("io-bm-"+i).value,10);
    if(up!==g.steps.upscale)o.upscale=up;
    if(ce!==g.steps.canvas_extend)o.canvas_extend=ce;
    if(bm!==g.bg_match_amount)o.bg_match=bm;
    if(Object.keys(o).length)out[f.name]=o;
  });
  return out;
}
function getChangedTargets(){
  var opts=getImageOptions();var t=[];
  FILES.forEach(function(f){
    var rNow=JSON.stringify(ratings[f.name]||{});
    var rPrev=JSON.stringify(PREV_RATINGS[f.name]||{});
    var oNow=JSON.stringify(opts[f.name]||{});
    var oPrev=JSON.stringify(IMG_OPTS[f.name]||{});
    if(rNow!==rPrev||oNow!==oPrev)t.push(f.name);
  });
  return t;
}

function os(i,k,v){v=parseInt(v);ratings[FILES[i].name][k]=v;var e=document.getElementById("v-"+i+"-"+k);e.textContent=v;e.className="sv "+(v<0?"neg":v>0?"pos":"zero");document.getElementById("row-"+i).className="author-row "+(SCALES.some(function(s){return ratings[FILES[i].name][s.key]!==0;})?"row-issue":"row-ok");us();as();}
function us(){var is=0,ok=0,ch=0;FILES.forEach(function(f){var hv=SCALES.some(function(s){return ratings[f.name][s.key]!==0;});var df=SCALES.some(function(s){return ratings[f.name][s.key]!==gpv(f.name,s.key);});if(hv)is++;else ok++;if(df)ch++;});document.getElementById("stats").textContent=ok+" OK, "+is+" issues, "+ch+" changed";document.getElementById("badge-all").textContent="All ("+FILES.length+")";document.getElementById("badge-issues").textContent="Issues ("+is+")";document.getElementById("badge-ok").textContent="OK ("+ok+")";document.getElementById("badge-changed").textContent="Changed ("+ch+")";}
function filterRows(m){FILES.forEach(function(f,i){var r=document.getElementById("row-"+i);var hi=SCALES.some(function(s){return ratings[f.name][s.key]!==0;});var df=SCALES.some(function(s){return ratings[f.name][s.key]!==gpv(f.name,s.key);});if(m==="all")r.style.display="";else if(m==="issues")r.style.display=hi?"":"none";else if(m==="ok")r.style.display=hi?"none":"";else if(m==="changed")r.style.display=df?"":"none";});}
function resetAll(){if(!confirm("Reset all to 0?"))return;FILES.forEach(function(f,i){SCALES.forEach(function(s){ratings[f.name][s.key]=0;document.getElementById("s-"+i+"-"+s.key).value=0;var e=document.getElementById("v-"+i+"-"+s.key);e.textContent="0";e.className="sv zero";});document.getElementById("row-"+i).className="author-row row-ok";});us();}
function resetToPrev(){if(!confirm("Reset to previous weights?"))return;FILES.forEach(function(f,i){SCALES.forEach(function(s){var v=gpv(f.name,s.key);ratings[f.name][s.key]=v;document.getElementById("s-"+i+"-"+s.key).value=v;var e=document.getElementById("v-"+i+"-"+s.key);e.textContent=v;e.className="sv "+(v<0?"neg":v>0?"pos":"zero");});document.getElementById("row-"+i).className="author-row "+(SCALES.some(function(s){return ratings[f.name][s.key]!==0;})?"row-issue":"row-ok");});us();}
function ged(){var o={};FILES.forEach(function(f){var n={};var a=false;SCALES.forEach(function(s){if(ratings[f.name][s.key]!==0){n[s.key]=ratings[f.name][s.key];a=true;}});if(a)o[f.name]=n;});return o;}
function exportJSON(){document.getElementById("jsonArea").value=JSON.stringify(ged(),null,2);}
function copyJSON(){navigator.clipboard.writeText(JSON.stringify(ged(),null,2)).then(function(){alert("Copied!");});}
function importJSON(){try{var d=JSON.parse(document.getElementById("jsonArea").value);FILES.forEach(function(f,i){SCALES.forEach(function(s){var v=(d[f.name]&&d[f.name][s.key])||0;ratings[f.name][s.key]=v;document.getElementById("s-"+i+"-"+s.key).value=v;var e=document.getElementById("v-"+i+"-"+s.key);e.textContent=v;e.className="sv "+(v<0?"neg":v>0?"pos":"zero");});document.getElementById("row-"+i).className="author-row "+(SCALES.some(function(s){return ratings[f.name][s.key]!==0;})?"row-issue":"row-ok");});us();alert("Imported "+Object.keys(d).length);}catch(e){alert("Error: "+e.message);}}

// Progress polling
var progressTimer=null;
function startProgressPoll(){
  document.getElementById("progress-container").classList.add("active");
  progressTimer=setInterval(function(){
    Promise.all([
      fetch("/api/progress").then(function(r){return r.json();}),
      fetch("/api/progress_log").then(function(r){return r.json();}).catch(function(){return {};})
    ]).then(function(results){
      var d=results[0], log=results[1];
      updateDetails(d, log);
      if(d.done){
        clearInterval(progressTimer);progressTimer=null;
        document.getElementById("p-pass").textContent="Done";
        document.getElementById("p-name").textContent="Complete!";
        document.getElementById("p-bar").style.width="100%";
        document.getElementById("p-file").textContent="";
        detailsBuilt=false;
        setTimeout(function(){
          document.getElementById("progress-container").classList.remove("active");
          location.reload();
        },2000);
        return;
      }
      // Compute overall progress from detailed log (accounts for pipeline parallelism)
      var passes=log.passes||{};
      var totalWork=0,doneWork=0;
      var activePasses=[];
      PASS_ORDER.forEach(function(pk){
        var info=passes[pk];
        if(!info)return;
        if(info.skipped)return;
        var fkeys=Object.keys(info.files||{});
        totalWork+=info.total||0;
        doneWork+=fkeys.filter(function(k){return info.files[k].status!=="processing";}).length;
        if(!info.done&&fkeys.length>0)activePasses.push("P"+pk);
      });
      var overallProgress=totalWork>0?(doneWork/totalWork*100):0;
      var passLabel=activePasses.length>0?activePasses.join("+"):"P"+d.pass;
      document.getElementById("p-pass").textContent=passLabel;
      document.getElementById("p-name").textContent=d.pass_name;
      document.getElementById("p-cur").textContent=doneWork;
      document.getElementById("p-tot").textContent=totalWork;
      document.getElementById("p-file").textContent=d.filename;
      document.getElementById("p-bar").style.width=overallProgress+"%";
      if(log._elapsed)document.getElementById("p-elapsed").textContent="["+fmtTime(log._elapsed)+"]";
    }).catch(function(){});
  },2000);
}

// True when any global setting (background, colour-match amount, steps) changed since load
function globalSettingsChanged(){
  return JSON.stringify(getSettings())!==JSON.stringify(LOADED_SETTINGS);
}

// Rerun (only changed weights)
function rerun(){
  if(!confirm("Save weights and re-run only changed images?"))return;
  var payload;
  if(globalSettingsChanged()){
    // A global setting changed — full re-run so every image recomposites
    payload=JSON.stringify({ratings:ged(),settings:getSettings(),image_options:getImageOptions(),regenerate:true});
  }else{
    payload=JSON.stringify({ratings:ged(),settings:getSettings(),image_options:getImageOptions(),targets:getChangedTargets()});
  }
  fetch("/api/rerun",{method:"POST",headers:{"Content-Type":"application/json"},body:payload})
    .then(function(r){return r.json();})
    .then(function(d){if(d.status==="started")startProgressPoll();})
    .catch(function(e){alert("Error: "+e);});
}

// Regenerate all images from scratch
function regenerate(){
  if(!confirm("Regenerate ALL images from scratch? This will re-run every pass."))return;
  var payload=JSON.stringify({ratings:ged(),regenerate:true,settings:getSettings(),image_options:getImageOptions()});
  fetch("/api/rerun",{method:"POST",headers:{"Content-Type":"application/json"},body:payload})
    .then(function(r){return r.json();})
    .then(function(d){if(d.status==="started")startProgressPoll();})
    .catch(function(e){alert("Error: "+e);});
}

// Regenerate from a specific pass (reuse earlier outputs)
function regenFrom(){
  var pass=prompt("Regenerate from which pass?\\n\\n1 = Upscale (Gemini)\\n1.25 = Green background\\n1.5 = Canvas extend (Gemini)\\n2 = Green screen keying\\n3 = Color adjustments\\n4 = Background composite","3");
  if(!pass)return;
  var p=parseFloat(pass);
  if(isNaN(p)||p<1||p>4){alert("Invalid pass number");return;}
  if(!confirm("Regenerate all images from pass "+p+"?"))return;
  var payload=JSON.stringify({ratings:ged(),regenerate:true,regen_from:p,settings:getSettings(),image_options:getImageOptions()});
  fetch("/api/rerun",{method:"POST",headers:{"Content-Type":"application/json"},body:payload})
    .then(function(r){return r.json();})
    .then(function(d){if(d.status==="started")startProgressPoll();})
    .catch(function(e){alert("Error: "+e);});
}

// End all
function endAll(){
  if(!confirm("Stop all running scripts and the server?"))return;
  fetch("/api/stop",{method:"POST"})
    .then(function(){window.close();})
    .catch(function(){window.close();});
}

// Run-config panel (steps, colour match, background)
function getSettings(){
  var bg="rainbow";var rs=document.getElementsByName("bgsel");
  for(var i=0;i<rs.length;i++){if(rs[i].checked)bg=rs[i].value;}
  return {steps:{
      upscale:document.getElementById("st-upscale").checked,
      canvas_extend:document.getElementById("st-canvas_extend").checked,
      bw:document.getElementById("st-bw").checked,
      bg_match:document.getElementById("st-bg_match").checked
    },
    bg_match_amount:parseInt(document.getElementById("bg-match-amount").value,10),
    background:bg,
    custom_background:CUSTOM_BG};
}
function applySettingsToPanel(s){
  if(!s||!s.steps)return;
  document.getElementById("st-upscale").checked=!!s.steps.upscale;
  document.getElementById("st-canvas_extend").checked=!!s.steps.canvas_extend;
  document.getElementById("st-bw").checked=!!s.steps.bw;
  document.getElementById("st-bg_match").checked=!!s.steps.bg_match;
  var amt=(s.bg_match_amount!==undefined)?s.bg_match_amount:50;
  document.getElementById("bg-match-amount").value=amt;
  document.getElementById("bg-match-val").textContent=amt;
  CUSTOM_BG=s.custom_background||"";
  var rs=document.getElementsByName("bgsel");
  for(var i=0;i<rs.length;i++){rs[i].checked=(rs[i].value===(s.background||"rainbow"));}
}
function wireRunCfg(){
  var sl=document.getElementById("bg-match-amount");
  sl.addEventListener("input",function(){document.getElementById("bg-match-val").textContent=sl.value;});
  var cf=document.getElementById("bg-custom-file");
  cf.addEventListener("change",function(){
    var file=cf.files[0];if(!file)return;
    var rd=new FileReader();
    rd.onload=function(){
      fetch("/api/upload_bg",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({filename:file.name,data_base64:rd.result})})
      .then(function(r){return r.json();})
      .then(function(d){
        if(d&&d.saved){
          CUSTOM_BG=d.saved;
          var rs=document.getElementsByName("bgsel");
          for(var i=0;i<rs.length;i++){rs[i].checked=(rs[i].value==="custom");}
          alert("Custom background uploaded: "+d.saved);
        }else{alert("Upload failed — use a PNG/JPG/WEBP image.");}
      }).catch(function(e){alert("Upload error: "+e);});
    };
    rd.readAsDataURL(file);
  });
}

// Accordion details
var PASS_ORDER=["1","1.25","1.5","2","3","4"];
var PASS_NAMES={"1":"Upscale/Copy","1.25":"Green BG","1.5":"Canvas Extend","2":"BG Remove","3":"Adjust/B&W","4":"Background"};
var detailsOpen=false;
var openPasses={};
var detailsBuilt=false;

function toggleDetails(){
  detailsOpen=!detailsOpen;
  var d=document.getElementById("p-details");
  var t=document.getElementById("p-toggle");
  d.classList.toggle("open",detailsOpen);
  t.innerHTML=detailsOpen?"&#9650; Hide details":"&#9660; Details";
}

function togglePassFiles(pk){
  openPasses[pk]=!openPasses[pk];
  var sk=pk.replace(".","_");
  var el=document.getElementById("pd-files-"+sk);
  var ar=document.getElementById("pd-arrow-"+sk);
  if(el)el.classList.toggle("open",openPasses[pk]);
  if(ar)ar.classList.toggle("open",openPasses[pk]);
}

function fmtTime(s){
  if(!s&&s!==0)return"";
  if(s<60)return Math.round(s)+"s";
  var m=Math.floor(s/60),r=Math.round(s%60);
  return m+"m"+("0"+r).slice(-2)+"s";
}

function buildDetailsOnce(){
  if(detailsBuilt)return;
  detailsBuilt=true;
  var container=document.getElementById("p-details");
  var html="";
  PASS_ORDER.forEach(function(pk){
    var sk=pk.replace(".","_");
    var pn=PASS_NAMES[pk]||("Pass "+pk);
    html+='<div class="pd-pass" id="pd-pass-'+sk+'">';
    html+='<div class="pd-pass-header" onclick="togglePassFiles(\''+pk+'\')">';
    html+='<span class="pd-arrow" id="pd-arrow-'+sk+'">&#9654;</span>';
    html+='<span class="pd-pass-name pending" id="pd-name-'+sk+'">Pass '+pk+': '+pn+'</span>';
    html+='<span class="pd-pass-count" id="pd-count-'+sk+'"></span>';
    html+='<span class="pd-pass-time" id="pd-time-'+sk+'"></span>';
    html+='</div>';
    html+='<div class="pd-pass-bar"><div class="pd-pass-bar-fill" id="pd-bar-'+sk+'" style="width:0%"></div></div>';
    html+='<div class="pd-files" id="pd-files-'+sk+'"></div>';
    html+='</div>';
  });
  html+='<div class="pd-total-time" id="pd-total-time"></div>';
  container.innerHTML=html;
}

function updateDetails(progress, log){
  var container=document.getElementById("p-details");
  if(!container)return;
  buildDetailsOnce();
  var curPass=progress.pass;
  var passes=log.passes||{};

  PASS_ORDER.forEach(function(pk){
    var sk=pk.replace(".","_");
    var info=passes[pk];
    var pn=info?info.name:PASS_NAMES[pk]||("Pass "+pk);
    var total=info?info.total:0;
    var filesObj=info?info.files:{};
    var fileKeys=Object.keys(filesObj);
    var count=fileKeys.length;
    var doneCount=fileKeys.filter(function(k){return filesObj[k].status!=="processing";}).length;
    var passNum=parseFloat(pk);
    var isDone=(info&&info.done)||false;
    var isSkipped=(info&&info.skipped)||false;
    var isActive=!progress.done&&!isDone&&!isSkipped&&count>0;
    var isPending=!isDone&&!isActive;
    var pct=total>0?(doneCount/total*100):0;
    if(isDone)pct=100;

    // Update name
    var nameEl=document.getElementById("pd-name-"+sk);
    var nameClass=isPending?"pending":isActive?"active":"";
    if(isSkipped)nameClass="pending";
    nameEl.className="pd-pass-name "+nameClass;
    var prefix=isDone?(isSkipped?"\u23ED ":"\u2713 "):"";
    nameEl.textContent=prefix+"Pass "+pk+": "+pn;

    // Update count
    var countEl=document.getElementById("pd-count-"+sk);
    if(total>0)countEl.textContent=doneCount+"/"+total;
    else if(isSkipped)countEl.textContent="skipped";
    else if(isDone)countEl.textContent="\u2713";
    else countEl.textContent="";

    // Update time
    var timeEl=document.getElementById("pd-time-"+sk);
    if(info&&info.elapsed>0)timeEl.textContent=fmtTime(info.elapsed);
    else timeEl.textContent="";

    // Update bar
    var barEl=document.getElementById("pd-bar-"+sk);
    barEl.style.width=pct+"%";
    barEl.className="pd-pass-bar-fill "+(isSkipped?"skipped":isDone?"done":isActive?"active":"");

    // Update file list (only rebuild if count changed or active pass)
    var filesEl=document.getElementById("pd-files-"+sk);
    if(filesEl.childElementCount!==count||(count>0&&isActive)){
      var fhtml="";
      fileKeys.forEach(function(fn){
        var fi=filesObj[fn];
        var isCur=isActive&&fi.status==="processing";
        var statusCls=fi.status||"processing";
        fhtml+='<div class="pd-file'+(isCur?" current":"")+'">';
        fhtml+='<span class="pd-fname">'+fn+'</span>';
        fhtml+='<span class="pd-fstatus '+statusCls+'">'+fi.status+'</span>';
        if(fi.elapsed>0)fhtml+='<span class="pd-ftime">'+fmtTime(fi.elapsed)+'</span>';
        else fhtml+='<span class="pd-ftime"></span>';
        fhtml+='</div>';
      });
      if(count===0&&isActive&&progress.filename){
        fhtml='<div class="pd-file current"><span class="pd-fname">'+progress.filename+'</span><span class="pd-fstatus processing">processing</span><span class="pd-ftime"></span></div>';
      }
      filesEl.innerHTML=fhtml;
    }
  });

  // Total elapsed
  var totalEl=document.getElementById("pd-total-time");
  if(totalEl&&log._elapsed){
    totalEl.textContent="Total: "+fmtTime(log._elapsed);
  }
}
